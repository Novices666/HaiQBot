# haiqbot —— 本文件只描述它自己。
#
# 这里**没有协议端**，而且是刻意的：OneBot v11 是一个协议，不是一个实现。
# NapCat / Lagrange / LLOneBot / go-cqhttp 都是独立项目，由你自己部署。
# haiqbot 只通过 haiq.docker.toml 里的 [onebot] 地址连过去。
#
# 首次使用（两条命令，让两个容器能互相看见）：
#   docker network create haiqbot_net
#   docker network connect haiqbot_net <你的协议端容器名>
#
# 只用官方平台、完全不要协议端时：把文件末尾 networks 那一整段删掉即可。
#
#   docker compose up -d --build
#
# 注意：
# 1. 端口只发布到宿主 127.0.0.1；公网最多反代 /i/*。
# 2. 协议端在别的网络里时连不上 —— 容器里的 127.0.0.1 是它自己。
# 3. 本机若装了系统代理（Clash 等），验证 http://127.0.0.1 时客户端要 trust_env=False。

services:
  haiqbot:
    build: .
    image: haiqbot:local
    container_name: haiqbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HAIQ_DATA_DIR: /data
      HAIQ_SECRETS_DIR: /secrets
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    volumes:
      # 状态：SQLite / 媒体库 / 插件参数。属主必须是容器里的 uid 10001。
      - ./data:/data
      # 凭据：vault.json（口令在 .env，不在这里）
      - ./secrets:/secrets
      # 插件挂进来即可热替换，不必重建镜像
      - ./plugins:/app/plugins
      - ./plugins-extra:/app/plugins-extra
      # 配置：容器版（本机开发用 haiq.toml，两者互不影响）。
      # 不能加 :ro —— 面板「配置中心」保存时直接写这个文件。
      - ./haiq.docker.toml:/app/haiq.toml
    ports:
      # 仅本机；公网只反代 /i/*
      - "127.0.0.1:8080:8080"

networks:
  # 和协议端共用一张网，才能用容器名互相访问
  default:
    name: haiqbot_net
    external: true
