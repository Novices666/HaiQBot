[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haiqbot"
version = "0.1.0"
description = "haiqbot — 协议无关的 QQ Bot 通用框架 + 插件生态"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Novices666" }]
keywords = ["qqbot", "onebot", "bot", "framework", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "cryptography>=50.0.2",
]

[project.urls]
Homepage = "https://github.com/Novices666/HaiQBot"
Repository = "https://github.com/Novices666/HaiQBot"
Issues = "https://github.com/Novices666/HaiQBot/issues"
Documentation = "https://github.com/Novices666/HaiQBot/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/Novices666/HaiQBot/releases"

[project.optional-dependencies]
# 官方 QQ 平台适配所需的 SDK，按需安装：uv sync --extra official
official = ["qq-botpy>=1.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
haiq = "haiqbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haiqbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
