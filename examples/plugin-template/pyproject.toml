# 独立插件仓库脚手架
#
# 用法：
#   cp -r examples/plugin-template ../haiqbot-plugin-demo && cd ../haiqbot-plugin-demo
#   uv sync && uv run pytest
#
# 然后在 haiqbot 侧：pip install -e ../haiqbot-plugin-demo
# 再到 haiq.toml 的 plugins.enabled 里加上 "demo"。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haiqbot-plugin-demo"
version = "0.1.0"
description = "haiqbot 插件脚手架"
requires-python = ">=3.11"
dependencies = ["haiqbot"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.entry-points."haiqbot.plugins"]
demo = "haiqbot_plugin_demo:Demo"

[tool.hatch.build.targets.wheel]
packages = ["src/haiqbot_plugin_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
