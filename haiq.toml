# haiqbot 配置 —— 请勿在此文件中写入任何密钥，密钥一律用 `haiq vault set` 管理。

data_dir = "data"
log_level = "INFO"
log_json = false

# 本地目录插件。必须写在任何 [section] 之前 —— 写在段内会变成段子键，
# 被静默忽略（表现是插件全部消失、且没有任何报错）。
# 相对路径按启动时的工作目录解析，所以起服务前先 cd 到项目根。
plugin_dirs = ["plugins"]

[plugins]
enabled = ["echo", "help", "admin", "painter", "chat", "guard"]

[plugins.chat]
ack_text = "🤔 思考中…"

# 每个插件的私有参数放在 [plugins.<id>] 下，例如：
# [plugins.painter]
# max_per_user_per_day = 20
provider = "openai_compat"
base_url = "https://ai.haigo.cc/v1"
model = "deepseek-v4.1-flash"
api_key_ref = "WEFT_CHAT_API_KEY"
system_prompt = "你是一个简洁友好的群聊助手，用中文回答，控制在 150 字以内。"
max_tokens = 800
temperature = 0.7
max_input_chars = 2000
history_turns = 6
retries = 4
retry_backoff_seconds = 1.0

[quota]
enabled = true
per_user_per_day = 20
per_channel_per_day = 300
rate_per_user_per_min = 6
rate_global_per_min = 120

[policy]
# 留空表示不限制
channel_whitelist = []
channel_blacklist = []
owners = []
admins = []

[media]
dir = "data/media"
ttl_seconds = 86400
# 公网反代基地址，例如 "https://bot.example.com"
# public_base_url 留空：协议端能直连本机，图片走 base64 内嵌最稳。
# 只有将来要「公网 URL」发图时才需要填一个公网可达地址。
public_base_url = ""
# 只读媒体服务：0 = 关闭。仅「公网 URL」方案需要（要别的机器能拉图）。
serve_port = 0

[webui]
enabled = true
host = "127.0.0.1"
port = 8080

[official]
enabled = false
# app_id = ""
app_secret_ref = "WEFT_QQ_APP_SECRET"

[onebot]
enabled = true
# client = 连协议端正向 WS / server = 我们起 WS 等协议端反向连入
# http   = API 走 HTTP POST，事件由我们起 HTTP 服务接收
# sse    = API 走 HTTP POST，事件走 SSE（不需要入站端口）
mode = "client"
url = "ws://127.0.0.1:3001"
# mode=http / sse 时协议端 HTTP API 的基址
http_api_url = "http://127.0.0.1:3000"
# mode=http：接收事件的路径；webhook_secret_ref 留空则退化成校验 Bearer token
webhook_path = "/onebot"
webhook_secret_ref = ""
# mode=sse：事件流路径
sse_path = "/_events"
access_token_ref = "WEFT_ONEBOT_ACCESS_TOKEN"
# 图片怎么发：auto（有本地文件就内嵌 base64，无需公网）/ base64 / url
image_transport = "auto"
# 控制类 API 超时 / 带媒体发送的超时（大图上传要留时间，别用 15s）
api_timeout_seconds = 60.0
send_timeout_seconds = 120

[plugins.painter]
provider = "openai_compat"
base_url = "https://ai.haigo.cc/v1"
model = "gpt-image-2"
api_key_ref = "WEFT_IMAGE_API_KEY"
size = "1024x1024"
max_prompt_chars = 800

[outbound]
enabled = true
min_interval_seconds = 1.2
global_per_minute = 30
max_wait_seconds = 30
retry_max = 3
retry_backoff_seconds = 2

# 凭据存储：所有平台同一套实现（不区分 Windows / Linux），文件可直接迁移
[vault]
# aead = scrypt + AES-256-GCM（推荐）；none = 明文（仅限你确信没人能读这台机器）
enc = "aead"
# 密码所在的环境变量名。真值只放环境变量，不写在这里。
passphrase_ref = "WEFT_VAULT_PASSPHRASE"

[plugins.guard]
# 风控（gating = "always"：不受频道开关约束）
window_seconds = 10
max_messages = 5
block_links = true
blocked_words = ""
warn_text = "⚠️ 慢一点：{seconds} 秒内最多 {limit} 条"
block_text = "🚫 已拦截：{reason}"
# 管理员免检。自测拦截效果时可以先设 false，验证完记得改回 true
exempt_admins = true
